name: PhoneDirect lead integration check

on:
  push:
    branches: [main]
    paths:
      - 'functions/api/lead.js'
      - 'google-apps-script/Code.gs'
      - 'tests/lead.test.mjs'
      - '.github/workflows/lead-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Cloudflare and Apps Script validation
        run: node --test tests/lead.test.mjs

  production-api:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed Cloudflare Function exists (does not send customer data)
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --retry 2 --max-time 20 -sS -L -o response.json -w '%{http_code}' 'https://phonedirect.pages.dev/api/lead')"
          echo "GET https://phonedirect.pages.dev/api/lead => HTTP ${status}"
          head -c 500 response.json
          echo
          if [[ "$status" != '405' ]]; then
            echo '::error::Pages Function not reachable as expected. Check Pages deployment and function routes.'
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open('response.json',encoding='utf-8') as f:
              payload=json.load(f)
          assert payload.get('ok') is False, payload
          PY
      - name: Verify Cloudflare bridge secrets (no customer data submitted)
        shell: bash
        run: |
          set -euo pipefail
          status='000'
          bridge=''
          for i in 1 2 3 4 5; do
            status="$(curl --retry 1 --max-time 15 -sS -L -D headers.txt -o response.json -w '%{http_code}' 'https://phonedirect.pages.dev/api/lead')"
            bridge="$(python3 -c 'from pathlib import Path; lines=Path("headers.txt").read_text().splitlines(); print(next((s.partition(":")[2].strip() for s in reversed(lines) if s.lower().startswith("x-lead-bridge-configured:")), "unknown"))')"
            if [[ -n "$bridge" ]]; then break; fi
            sleep 5
          done
          missing="$(python3 -c 'from pathlib import Path; lines=Path("headers.txt").read_text().splitlines(); print(next((s.partition(":")[2].strip() for s in reversed(lines) if s.lower().startswith("x-lead-bridge-missing:")), "unknown"))')"
          echo "DB bridge configured: ${bridge:-unknown}; missing: ${missing:-unknown} (GET HTTP ${status})"
          if [[ "$bridge" != 'yes' ]]; then
            echo '::error::Cloudflare Pages Sheets bridge secrets are missing (no) or the new backend is not deployed (unknown). Configure SHEETS_WEB_APP_URL and SHEETS_INGEST_TOKEN.'
            exit 1
          fi

  script-webapp-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Google Apps Script deployment (GET only)
        shell: bash
        env:
          WEB_APP_URL: 'https://script.google.com/macros/s/AKfycbx67LTmh1wAejnGvmBA3m6i4Myrk2HuSJVJW8QYcC_VFEDBOW_AWix_iZ7z0Cz9L5pPqA/exec'
        run: |
          set -euo pipefail
          status="$(curl --retry 2 --max-time 25 --location --silent --show-error --output web-app.json --write-out '%{http_code}' "$WEB_APP_URL")"
          echo "Apps Script GET HTTP status: $status"
          STATUS="$status" python3 - <<'PY'
          import json, os
          with open('web-app.json',encoding='utf-8') as f:
              data=json.load(f)
          assert os.environ['STATUS']=='200' and data.get('code')=='method_not_allowed' and data.get('ok') is False, data
          print('Apps Script deployment and doGet verified')
          PY
